<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>読みもの（ブログ）｜TOGIYA 研屋</title>
<meta name="description" content="天然砥石と漆・金継ぎ材料にまつわる読みもの。硬度表記の読み方、材料の基礎知識、産地と供給のいまをお伝えします。">
<style>
  :root{
    --bg:#f3f0e9; --bg-soft:#faf8f2; --ink:#2a2721; --ink-soft:#5c574b;
    --muted:#8a8474; --line:#ddd6c6; --gold:#a8862f; --shu:#a03a26;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);line-height:1.9;font-size:15px;}
  h1,h2,h3,.serif{font-family:"Hiragino Mincho ProN","Hiragino Mincho Pro","YuMincho","Yu Mincho","Noto Serif JP",serif;font-weight:600;}
  a{color:inherit;}
  img{max-width:100%;display:block;}
  .wrap{max-width:1020px;margin:0 auto;padding:0 20px;}
  header{border-bottom:1px solid var(--line);background:var(--bg-soft);}
  .header-in{display:flex;align-items:center;justify-content:space-between;padding:16px 0;flex-wrap:wrap;gap:10px;}
  .logo{font-family:"Hiragino Mincho ProN","YuMincho",serif;font-size:20px;letter-spacing:.18em;text-decoration:none;}
  .logo span{color:var(--gold);}
  nav{display:flex;gap:20px;flex-wrap:wrap;}
  nav a{text-decoration:none;font-size:13px;letter-spacing:.08em;color:var(--ink-soft);}
  nav a:hover{color:var(--shu);}
  .page-head{padding:56px 0 10px;text-align:center;}
  .page-head .en{font-size:11px;letter-spacing:.4em;color:var(--gold);margin-bottom:10px;}
  .page-head h1{font-size:30px;letter-spacing:.14em;}
  .page-head p{color:var(--ink-soft);margin-top:14px;font-size:14px;}
  .post-list{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;padding:44px 0 80px;}
  @media(max-width:860px){.post-list{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:560px){.post-list{grid-template-columns:1fr;}}
  .post-card{background:var(--bg-soft);border:1px solid var(--line);border-radius:4px;overflow:hidden;}
  .post-card a{text-decoration:none;display:block;height:100%;}
  .post-card img{width:100%;height:170px;object-fit:cover;}
  .post-body{padding:18px 18px 20px;}
  .post-meta{font-size:11px;color:var(--muted);letter-spacing:.1em;margin-bottom:8px;}
  .post-meta .cat{color:var(--shu);}
  .post-card h2{font-size:16px;line-height:1.6;margin-bottom:8px;}
  .post-card p{font-size:13px;color:var(--ink-soft);line-height:1.8;}
  .status{grid-column:1/-1;text-align:center;color:var(--muted);padding:30px 0;}
  footer{border-top:1px solid var(--line);background:var(--bg-soft);padding:34px 0;text-align:center;font-size:12px;color:var(--muted);letter-spacing:.08em;}
</style>
</head>
<body>

<header>
  <div class="wrap header-in">
    <a class="logo" href="../index.html">TOGIYA <span>研屋</span></a>
    <nav>
      <a href="../index.html#concept">コンセプト</a>
      <a href="../index.html#business">事業紹介</a>
      <a href="../db.html">砥石データベース</a>
      <a href="./index.html">ブログ</a>
      <a href="../index.html#contact">お問い合わせ</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="page-head">
    <p class="en">JOURNAL</p>
    <h1>読みもの</h1>
    <p>砥石と材料の基礎知識、産地と供給のいまを、専門用語をできるだけ噛み砕いてお伝えします。</p>
    <p style="margin-top:16px;font-size:13px;"><a href="../en/blog/index.html" style="color:var(--shu);">English articles — Journal in English →</a></p>
  </div>

  <div class="post-list" id="postList">
    <p class="status" id="listStatus">記事を読み込んでいます…</p>
    <noscript><p class="status">記事一覧の表示にはJavaScriptが必要です。</p></noscript>
  </div>
</main>

<footer>
  <p>TOGIYA 研屋｜天然砥石と漆・金継ぎ材料の仲介</p>
</footer>

<script>
(function(){
  var listEl = document.getElementById('postList');
  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function render(posts){
    listEl.innerHTML = '';
    if(!posts || posts.length === 0){
      listEl.innerHTML = '<p class="status">記事はまだありません。</p>';
      return;
    }
    posts.forEach(function(p){
      var card = document.createElement('article');
      card.className = 'post-card';
      card.innerHTML =
        '<a href="' + esc(p.slug) + '.html">' +
          '<img src="' + esc(p.thumb) + '" alt="">' +
          '<div class="post-body">' +
            '<p class="post-meta"><span class="cat">' + esc(p.category) + '</span>｜' + esc(p.date) + '</p>' +
            '<h2>' + esc(p.title) + '</h2>' +
            '<p>' + esc(p.excerpt) + '</p>' +
          '</div>' +
        '</a>';
      listEl.appendChild(card);
    });
  }
  fetch('posts.json')
    .then(function(r){ if(!r.ok) throw new Error('load error'); return r.json(); })
    .then(function(data){ render(data.posts || []); })
    .catch(function(){
      listEl.innerHTML = '<p class="status">記事一覧を読み込めませんでした。時間をおいて再度お試しください。</p>';
    });
})();
</script>

</body>
</html>
